version: 2

models:
  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: fct_daily_sales
    columns:
      - name: sale_date
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
